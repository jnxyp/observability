name: observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_wal_size=512MB
    volumes:
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.35
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-remote-write-receiver
      - --web.enable-admin-api
      - --web.enable-lifecycle
      - --query.max-concurrency=4
      - --query.timeout=2m
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/prometheus/data:/prometheus
    mem_limit: 512m
    cpus: 0.60
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    environment:
      COS_ACCESS_KEY_ID: ${COS_ACCESS_KEY_ID:?set COS_ACCESS_KEY_ID}
      COS_SECRET_ACCESS_KEY: ${COS_SECRET_ACCESS_KEY:?set COS_SECRET_ACCESS_KEY}
      COS_ENDPOINT: ${COS_ENDPOINT:?set COS_ENDPOINT}
      COS_REGION: ${COS_REGION:?set COS_REGION}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:?set COS_BUCKET_NAME}
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/loki/data:/loki
    mem_limit: 1280m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}/
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_EMAIL: ${GRAFANA_ADMIN_EMAIL:?set GRAFANA_ADMIN_EMAIL}
      GRAFANA_ADMIN_EMAIL: ${GRAFANA_ADMIN_EMAIL:?set GRAFANA_ADMIN_EMAIL}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:587
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: Durian Observebility Platform
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_LOG_MODE: console
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/grafana/data:/var/lib/grafana
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${OBSERVABILITY_ROOT:-/home/ubuntu/docker_projects/observability}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 1g
    cpus: 0.30
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

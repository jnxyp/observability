              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "grafanacloud-prom",
              "model": {
                "expr": "sum(increase(node_network_receive_bytes_total{instance=~\"cn-hk-grafana(\\\\.jnxyp\\\\.net)?\",device=\"eth0\"}[30d]) + increase(node_network_transmit_bytes_total{instance=~\"cn-hk-grafana(\\\\.jnxyp\\\\.net)?\",device=\"eth0\"}[30d]))",

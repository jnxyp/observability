              "refId": "A",
              "queryType": "range",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "grafanacloud-logs",
              "model": {
                "expr": "sum by (container, instance) (count_over_time({job=\"integrations/docker\", container=\"fossicdiscuz-php-1\", instance=\"cn-hk-fossic.jnxyp.net\"} |= \"server reached pm.max_children\" [10m]))",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "queryType": "range",
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "reducer": "last",
                "refId": "B",
                "settings": {
                  "mode": "dropNN"
                },
                "type": "reduce"
              }
            },
            {
              "refId": "E",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "$B > 0",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "E",
                "type": "math"
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "2m",
          "keepFiringFor": "5m",
          "annotations": {
            "description": "PHP-FPM container {{ $labels.container }} on {{ $labels.instance }} reached pm.max_children within the last 10 minutes. Requests may queue or fail. Check PHP-FPM slow logs, request rate, CPU, memory, and upstream 5xx responses.",
            "summary": "PHP-FPM pool saturated on {{ $labels.instance }}"
          },
          "labels": {
            "severity": "warning",
            "team": "ops"
          },
          "isPaused": false
        }
      ]
    },

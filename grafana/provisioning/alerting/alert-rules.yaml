{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "caddy",
      "folder": "Operations",
      "interval": "1m",
      "rules": [
        {
          "uid": "ffop037pr0yyoe",
          "title": "Caddy High 5xx Error Rate",
          "condition": "E",
          "data": [
            {
              "refId": "A",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "grafanacloud-prom",
              "model": {
                "expr": "sum by (instance) (rate(caddy_http_request_duration_seconds_count{job=\"integrations/caddy\",handler=\"subroute\",code=~\"5..\"}[5m])) / sum by (instance) (rate(caddy_http_request_duration_seconds_count{job=\"integrations/caddy\",handler=\"subroute\"}[5m]))",
                "intervalMs": 1000,
                "legendFormat": "{{instance}} 5xx ratio",
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "D",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "grafanacloud-prom",
              "model": {
                "expr": "sum by (instance) (rate(caddy_http_request_duration_seconds_count{job=\"integrations/caddy\",handler=\"subroute\"}[5m]))",
                "intervalMs": 1000,
                "legendFormat": "{{instance}} total",
                "maxDataPoints": 43200,
                "refId": "D"
              }
            },
            {
              "refId": "B",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "reducer": "last",
                "refId": "B",
                "settings": {
                  "mode": "dropNN"
                },
                "type": "reduce"
              }
            },
            {
              "refId": "F",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "D",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "reducer": "last",
                "refId": "F",
                "settings": {
                  "mode": "dropNN"
                },
                "type": "reduce"
              }
            },
            {
              "refId": "E",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "($B > 0.10) * ($F > 1)",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "E",
                "type": "math"
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "5m",
          "keepFiringFor": "0s",
          "annotations": {
            "description": "Caddy on {{ $labels.instance }} has 5xx error ratio above 10% with traffic > 1 req/s, sustained for 5 minutes. Check for upstream failures or application crashes.",
            "summary": "High 5xx error rate on {{ $labels.instance }}"
          },
          "labels": {
            "severity": "warning",
            "team": "ops"
          },
          "isPaused": false
        },
        {
          "uid": "dfop04brbfev4d",
          "title": "Caddy High 4xx Error Rate",
          "condition": "E",
          "data": [
            {
              "refId": "A",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "grafanacloud-prom",
              "model": {
                "expr": "sum by (instance) (rate(caddy_http_request_duration_seconds_count{job=\"integrations/caddy\",handler=\"subroute\",code=~\"4..\",code!=\"403\"}[5m])) / sum by (instance) (rate(caddy_http_request_duration_seconds_count{job=\"integrations/caddy\",handler=\"subroute\"}[5m]))",
                "intervalMs": 1000,
                "legendFormat": "{{instance}}",
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "D",
              "queryType": "",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "grafanacloud-prom",
              "model": {
                "expr": "sum by (instance) (rate(caddy_http_request_duration_seconds_count{job=\"integrations/caddy\",handler=\"subroute\"}[5m]))",
                "intervalMs": 1000,
                "legendFormat": "{{instance}} total",
                "maxDataPoints": 43200,
                "refId": "D"
              }
            },
            {
              "refId": "B",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "reducer": "last",
                "refId": "B",
                "settings": {
                  "mode": "dropNN"
                },
                "type": "reduce"
              }
            },
            {
              "refId": "F",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "D",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "reducer": "last",
                "refId": "F",
                "settings": {
                  "mode": "dropNN"
                },
                "type": "reduce"
              }
            },
            {
              "refId": "E",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "expression": "($B > 0.25) * ($F > 1)",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "E",
                "type": "math"
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "5m",
          "keepFiringFor": "0s",
          "annotations": {
            "description": "Caddy on {{ $labels.instance }} has 4xx error ratio (excluding 403) above 25% with traffic > 1 req/s, sustained for 5 minutes. 403 is excluded because bots crawling Discuz action links generate large volumes of expected 403 responses. Check for broken clients, misconfigured routes, or auth issues.",
            "summary": "High 4xx error rate on {{ $labels.instance }}"
          },
          "labels": {
            "severity": "warning",
            "team": "ops"
          },
          "isPaused": false
        }
      ]
    },
    {
      "orgId": 1,
      "name": "infrastructure",

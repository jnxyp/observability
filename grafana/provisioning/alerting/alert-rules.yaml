            "summary": "Instance {{ $labels.instance }} is down or unreachable"
          },
          "labels": {
            "severity": "critical",
            "team": "ops"
          },
          "isPaused": false
        }
      ]
    },
    {
      "orgId": 1,
      "name": "traffic",
      "folder": "Operations",
      "interval": "5m",
